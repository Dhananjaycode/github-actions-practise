name: Auto Linter
on:
  push: 
    paths: "*.py"
    branches: ["main"]
jobs:
  code-linter:
    runs-on: ubuntu-latest
    # this step will automatically clone the code from current branch into the runner
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # Specify your desired version (e.g., '3.12', '3.13')
          cache: 'pip'           
        
      - name: Install Linter
        run: pip install ruff

      - name: Install black
        run: pip install black

      - name: Format code 
        run: black *.py
        
      - name: check the file for linting
        run: ruff check .
  

